<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Mission Accomplished | The Self-Love Sanctuary</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
}

.room {
    width: 100%;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    overflow: hidden;
}

.room video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
}

/* LARGE MOBILE-FRIENDLY HOTSPOTS */
.hotspot {
    position: absolute;
    z-index: 15;
    display: block;
    font-size: 0;
    border: none;
    padding: 0;
    margin: 0;
    cursor: pointer;
    outline: none;
    -webkit-user-select: none;
    user-select: none;
    background: rgba(255, 255, 255, 0.1);
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
}

/* Show borders on mobile for debugging - remove later */
@media (max-width: 768px) {
    .hotspot {
        border: 2px solid rgba(255, 0, 0, 0.5);
    }
}

/* MARKETPLACE - LEFT BOX */
.marketplace {
    left: 12%;
    top: 68%;
    width: 18%;
    height: 10%;
    min-width: 80px;
    min-height: 60px;
}

/* RETURN HOME - CENTER BOX */
.return-home {
    left: 42%;
    top: 68%;
    width: 18%;
    height: 10%;
    min-width: 80px;
    min-height: 60px;
}

/* REPLAY DAY ONE - RIGHT BOX */
.replay-day-one {
    left: 70%;
    top: 68%;
    width: 18%;
    height: 10%;
    min-width: 80px;
    min-height: 60px;
}

/* CONTINUE JOURNEY - Pink button at top */
.continue-journey {
    left: 20%;
    top: 42%;
    width: 60%;
    height: 6%;
    min-width: 100px;
    min-height: 80px;
}

/* Active state for mobile feedback */
.hotspot:active {
    background: rgba(255, 255, 255, 0.2);
    opacity: 0.8;
}
</style>
</head>

<body>

<div class="room">
    <video autoplay loop playsinline controls>
        <source src="REBUILD%20ME%20MISSION%20ACCOMPLISH%20ROOM.mp4" type="video/mp4">
        Your browser does not support the video.
    </video>
    
    <a class="hotspot marketplace" 
       href="marketplace.html"
       aria-label="Visit the Sanctuary Marketplace">
    </a>
    
    <a class="hotspot return-home" 
       href="Rebuilding_Me_Sanctuary_Reader_DOOR_1_LIGHTWEIGHT.html"
       aria-label="Return Home">
    </a>
    
    <a class="hotspot replay-day-one" 
       href="index.html"
       aria-label="Replay Day One">
    </a>
    
    <a class="hotspot continue-journey"
       href="transition.html"
       aria-label="Continue to My Next Journey">
