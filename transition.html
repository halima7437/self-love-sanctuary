<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transition Room | The Self-Love Sanctuary</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    .transition-room {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
      overflow: hidden;
    }

    .transition-room video {
      display: block;
      width: auto;
      height: 100vh;
      max-width: 100vw;
      max-height: 100vh;
      object-fit: contain;
    }

    .door-hotspot {
      position: absolute;
      left: 50%;
      top: 88%;
      transform: translate(-50%, -50%);
      width: 34%;
      height: 8%;
      z-index: 10;
      cursor: pointer;
      background: transparent;
      border: none;
      padding: 0;
      margin: 0;
      text-decoration: none;
      display: block;
      outline: none;
    }
  </style>
</head>

<body>

  <div class="transition-room">
    <video autoplay playsinline controls>
      <source src="transition-room.mp4" type="video/mp4">
    </video>
    <a class="door-hotspot"
       href="NEVER-ENDING%20PROMISES%20ROOM.mp4"
       aria-label="Come and Open the Door"
       title="Come and Open the Door"
    ></a>
  </div>

</body>
</html>
