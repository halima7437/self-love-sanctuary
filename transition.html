<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transition Room | The Self-Love Sanctuary</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    .transition-room {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .transition-room video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .door-link {
      position: absolute;
      left: 50%;
      top: 88%;
      transform: translate(-50%, -50%);
      width: 34%;
      height: 8%;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      text-decoration: none;
      font-size: clamp(14px, 1.4vw, 24px);
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-shadow: 0 2px 10px rgba(0,0,0,0.7);
      border-radius: 10px;
      background: rgba(255,255,255,0.03);
    }
  </style>
</head>

<body>

  <div class="transition-room">
    <video autoplay playsinline controls>
      <source src="transition-room.mp4" type="video/mp4">
    </video>

    <a class="door-link"
       href="NEVER-ENDING%20PROMISES%20ROOM.mp4"
       aria-label="Come and Open the Door">COME AND OPEN THE DOOR</a>
  </div>

</body>
</html>
