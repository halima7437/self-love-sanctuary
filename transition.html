<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transition Room | The Self-Love Sanctuary</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    .transition-room {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      overflow: hidden;
    }

    .transition-room video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      z-index: 1;
      display: block;
    }

    .door-hotspot {
      position: fixed;
      z-index: 100;
      cursor: pointer;
      background: transparent;
      border: none;
      padding: 0;
      margin: 0;
      text-decoration: none;
      display: block;
      outline: none;
      -webkit-user-select: none;
      user-select: none;
    }
  </style>
</head>

<body>

  <div class="transition-room">
    <video id="transitionVideo" autoplay playsinline controls>
      <source src="transition-room.mp4" type="video/mp4">
    </video>
  </div>

  <a class="door-hotspot"
     id="doorHotspot"
     href="javascript:void(0)"
     aria-label="Come and Open the Door"
     title="Come and Open the Door"
  ></a>

  <script>
    const video = document.getElementById('transitionVideo');
    const hotspot = document.getElementById('doorHotspot');
    const container = video.parentElement;

    function positionHotspot() {
      const containerRect = container.getBoundingClientRect();
      
      // Calculate button position based on container viewport
      const buttonWidth = containerRect.width * 0.34;
      const buttonHeight = containerRect.height * 0.08;
      const buttonLeft = containerRect.left + (containerRect.width * 0.5) - (buttonWidth * 0.5);
      const buttonTop = containerRect.top + (containerRect.height * 0.88) - (buttonHeight * 0.5);
      
      hotspot.style.left = buttonLeft + 'px';
      hotspot.style.top = buttonTop + 'px';
      hotspot.style.width = buttonWidth + 'px';
      hotspot.style.height = buttonHeight + 'px';
    }

    // Position on load
    window.addEventListener('load', positionHotspot);
    
    // Reposition on resize and orientation change
    window.addEventListener('resize', positionHotspot);
    window.addEventListener('orientationchange', positionHotspot);
    
    // Reposition periodically to handle dynamic changes
    setInterval(positionHotspot, 500);

    // Handle click - navigate to video file directly
    hotspot.addEventListener('click', function(e) {
      e.preventDefault();
      e.stopPropagation();
      // Navigate to the video file - browser will play it or download it
      window.location.href = 'NEVER-ENDING%20PROMISES%20ROOM.mp4';
    });

    // Also handle keyboard
    hotspot.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        e.stopPropagation();
        window.location.href = 'NEVER-ENDING%20PROMISES%20ROOM.mp4';
      }
    });
  </script>

</body>
</html>
