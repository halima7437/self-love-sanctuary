<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transition Room | The Self-Love Sanctuary</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    .transition-room {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      overflow: hidden;
    }

    .transition-room video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      z-index: 1;
      display: block;
      pointer-events: none;
    }

    .door-hotspot {
      position: fixed;
      z-index: 100;
      cursor: pointer;
      background: transparent;
      border: none;
      padding: 0;
      margin: 0;
      text-decoration: none;
      display: block;
      outline: none;
      -webkit-user-select: none;
      user-select: none;
      pointer-events: all;
    }

    .door-hotspot:focus {
      outline: 2px solid rgba(255, 255, 255, 0.1);
    }
  </style>
</head>

<body>

  <div class="transition-room">
    <video id="transitionVideo" autoplay playsinline controls>
      <source src="transition-room.mp4" type="video/mp4">
    </video>
  </div>

  <a class="door-hotspot"
     id="doorHotspot"
     href="NEVER-ENDING%20PROMISES%20ROOM.mp4"
     aria-label="Come and Open the Door"
     title="Come and Open the Door"
  ></a>

  <script>
    const video = document.getElementById('transitionVideo');
    const hotspot = document.getElementById('doorHotspot');

    function positionHotspot() {
      const videoRect = video.getBoundingClientRect();
      
      // Calculate button position based on video display
      const buttonWidth = videoRect.width * 0.34;
      const buttonHeight = videoRect.height * 0.08;
      const buttonLeft = videoRect.left + (videoRect.width * 0.5) - (buttonWidth * 0.5);
      const buttonTop = videoRect.top + (videoRect.height * 0.88) - (buttonHeight * 0.5);
      
      hotspot.style.left = buttonLeft + 'px';
      hotspot.style.top = buttonTop + 'px';
      hotspot.style.width = buttonWidth + 'px';
      hotspot.style.height = buttonHeight + 'px';
    }

    // Position immediately and on resize
    positionHotspot();
    window.addEventListener('resize', positionHotspot);
    window.addEventListener('orientationchange', positionHotspot);
    
    // Reposition periodically in case video dimensions change
    setInterval(positionHotspot, 500);

    // Handle click with direct navigation
    hotspot.onclick = function() {
      window.location.href = 'NEVER-ENDING%20PROMISES%20ROOM.mp4';
      return false;
    };
  </script>

</body>
</html>
