<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transition Room | The Self-Love Sanctuary</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    .transition-room {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      overflow: hidden;
    }

    .transition-room video {
      display: block;
      width: auto;
      height: 100vh;
      max-width: 100vw;
      max-height: 100vh;
      object-fit: contain;
      z-index: 1;
    }

    .door-hotspot {
      position: absolute;
      left: 30%;
      bottom: 12%;
      width: 40%;
      height: 15%;
      z-index: 10;
      cursor: pointer;
      background: transparent;
      border: none;
      padding: 0;
      margin: 0;
      text-decoration: none;
      display: block;
      outline: none;
      -webkit-user-select: none;
      user-select: none;
    }
  </style>
</head>

<body>

  <div class="transition-room">
    <video autoplay playsinline controls>
      <source src="transition-room.mp4" type="video/mp4">
    </video>
    <a class="door-hotspot"
       id="doorHotspot"
       href="never-ending-promises-room.html"
       aria-label="Come and Open the Door"
       title="Come and Open the Door"
    ></a>
  </div>

  <script>
    document.getElementById('doorHotspot').addEventListener('click', function(e) {
      e.preventDefault();
      window.location.href = 'never-ending-promises-room.html';
    });
  </script>

</body>
</html>
