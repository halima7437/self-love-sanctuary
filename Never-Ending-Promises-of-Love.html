<script>
const P=[["LOVE ❤️","“Yea, I have loved thee with an everlasting love: therefore with lovingkindness have I drawn thee.”","Jeremiah 31:3 (KJV)","You are loved with a love that does not run out."],["LOVE ❤️","“We love him, because he first loved us.”","1 John 4:19 (KJV)","Before you reached for Him, His love was already reaching for you."],["LOVE ❤️","“Behold, what manner of love the Father hath bestowed upon us, that we should be called the sons of God...”","1 John 3:1 (KJV)","You belong to God. Let that truth speak to your worth."],["LOVE ❤️","“For God so loved the world, that he gave his only begotten Son...”","John 3:16 (KJV)","God's love gives. God's love reaches. God's love includes you."],["LOVE ❤️","“But God commendeth his love toward us, in that, while we were yet sinners, Christ died for us.”","Romans 5:8 (KJV)","You did not have to become perfect before God chose to love you."],["LOVE ❤️","“Nor height, nor depth, nor any other creature, shall be able to separate us from the love of God, which is in Christ Jesus our Lord.”","Romans 8:39 (KJV)","Nothing can separate you from the love God has for you."],["LOVE ❤️","“He that loveth not knoweth not God; for God is love.”","1 John 4:8 (KJV)","Love is not merely something God gives. Scripture tells us: God is love."],["LOVE ❤️","“And we have known and believed the love that God hath to us.”","1 John 4:16 (KJV)","You can learn to rest in the truth that you are loved."],["LOVE ❤️","“Keep yourselves in the love of God, looking for the mercy of our Lord Jesus Christ unto eternal life.”","Jude 1:21 (KJV)","Stay close to the love that reminds you who you are."],["LOVE ❤️","“And above all these things put on charity, which is the bond of perfectness.”","Colossians 3:14 (KJV)","Carry love with you. Let it shape how you see yourself and others."],["PEACE 🕊️","“Peace, I leave with you, my peace I give unto you...”","John 14:27 (KJV)","His peace can meet you even when everything around you is unsettled."],["PEACE 🕊️","“And the character and care of God. You may bring your wounded places to Him."],["HEALING 🌿","“Heal me, O LORD, and I shall be healed; save me, and I shall be saved...”","Jeremiah 17:14 (KJV)","You can bring your need for healing directly to God."],["HEALING 🌿","“O LORD my God, I cried unto thee, and thou hast healed me.”","Psalm 30:2 (KJV)","Your cry is not too small to bring before God."],["HEALING 🌿","“He sent his word, and healed them, and delivered them from their destructions.”","Psalm 107:20 (KJV)","Let His Word meet you in the places that need restoration."],["HEALING 🌿","“For I will restore health unto thee, and I will heal thee of thy wounds, saith the LORD...”","Jeremiah 30:17 (KJV)","A wound does not have to be the final chapter of your story."],["HEALING 🌿","“...with his stripes we are healed.”","Isaiah 53:5 (KJV)","Your pain can be brought into the presence of God's redemptive love."],["HEALING 🌿","“Bless the LORD, O my soul, and forget not all his benefits: Who forgiveth all thine iniquities; who healeth all thy diseases;”","Psalm 103:2–3 (KJV)","Remember His goodness as you continue your healing journey."],["HEALING 🌿","“The LORD is nigh unto them that are of a broken heart...”","Psalm 34:18 (KJV)","A broken heart does not place you beyond God's presence. He is near."],["HEALING 🌿","“...after that ye have suffered a while, make you perfect, stablish, strengthen, settle you.”","1 Peter 5:10 (KJV)","What you have endured does not mean you will remain where suffering left you."],["STRENGTH 💪🏾","“Fear thou not; for I am with thee... I will strengthen thee; yea, I will help thee...”","Isaiah 41:10 (KJV)","You do not have to find all the strength within yourself. God promises His help."],["STRENGTH 💪🏾","“I can do all things through Christ which strengtheneth me.”","Philippians 4:13 (KJV)","You are not walking forward in your strength alone."],["STRENGTH 💪🏾","“God is our refuge and strength, a very present help in trouble.”","Psalm 46:1 (KJV)","When life feels unsteady, you still have somewhere to lean."],["STRENGTH 💪🏾","“The LORD is my strength and my shield; my heart trusted in him, and I am helped...”","Psalm 28:7 (KJV)","Let yourself be supported. You were never required to carry everything alone."],["STRENGTH 💪🏾","“The LORD is my strength and song, and is become my salvation.”","Psalm 118:14 (KJV)","The One who strengthens you can also put a new song in your heart."],["STRENGTH 💪🏾","“...the joy of the LORD is your strength.”","Nehemiah 8:10 (KJV)","Strength does not always look like struggling harder. Sometimes it arrives through joy."],["STRENGTH 💪🏾","“He giveth power to the faint; and to them that have no might he increaseth strength.”","Isaiah 40:29 (KJV)","Feeling tired does not disqualify you from receiving new strength."],["STRENGTH 💪🏾","“But they that wait upon the LORD shall renew their strength; they shall mount up with wings as eagles...”","Isaiah 40:31 (KJV)","Waiting is not always standing still. Sometimes it is where your strength is being renewed."],["STRENGTH 💪🏾","“My flesh and my heart faileth: but God is the strength of my heart, and my portion for ever.”","Psalm 73:26 (KJV)","Even when you feel depleted, your weakness does not exhaust God's strength."],["STRENGTH 💪🏾","“The LORD is good, a strong hold in the day of trouble; and he knoweth them that trust in him.”","Nahum 1:7 (KJV)","There is a place of refuge for you when the day becomes difficult."],["HOPE 🌅","“For I know the thoughts that I think toward you... thoughts of peace, and not of evil, to give you an expected end.”","Jeremiah 29:11 (KJV)","What you see today is not the whole story. There is still a future beyond this moment."],["HOPE 🌅","“Weeping may endure for a night, but joy cometh in the morning.”","Psalm 30:5 (KJV)","The night may have been real—but morning still comes."],["HOPE 🌅","“It is of the LORD'S mercies that we are not consumed... They are new every morning: great is thy faithfulness.”","Lamentations 3:22–23 (KJV)","Today arrived carrying new mercy. You are allowed to begin again."],["HOPE 🌅","“Now the God of hope fill you with all joy and peace in believing, that ye may abound in hope...”","Romans 15:13 (KJV)","Hope does not have to arrive empty-handed. There can still be joy and peace along the way."],["HOPE 🌅","“Why art thou cast down, O my soul?... hope thou in God...”","Psalm 42:11 (KJV)","You can acknowledge a heavy heart and still make room for hope."],["HOPE 🌅","“For surely there is an end; and thine expectation shall not be cut off.”","Proverbs 23:18 (KJV)","This moment has an ending. Do not surrender your expectation for what can still come."],["HOPE 🌅","“Which hope we have as an anchor of the soul, both sure and stedfast...”","Hebrews 6:19 (KJV)","When emotions move like waves, let hope become an anchor for your soul."],["HOPE 🌅","“The LORD is my portion, saith my soul; therefore will I hope in him.”","Lamentations 3:24 (KJV)","When you cannot see everything ahead, you can still choose where to place your hope."],["HOPE 🌅","“Be of good courage, and he shall strengthen your heart, all ye that hope in the LORD.”","Psalm 31:24 (KJV)","Keep hope alive. Your heart can be strengthened for what comes next."],["HOPE 🌅","“For thou art my hope, O Lord GOD: thou art my trust from my youth.”","Psalm 71:5 (KJV)","You are not placing your hope in nothing. You are placing it in the God who has carried you before."],["WORTH 👑","“I will praise thee; for I am fearfully and wonderfully made...”","Psalm 139:14 (KJV)","Your worth did not begin with someone else's approval. You were wonderfully made by God."],["WORTH 👑","“But even the very hairs of your head are all numbered. Fear not therefore: ye are of more value than many sparrows.”","Luke 12:7 (KJV)","You are seen in the smallest details. Your life has value to God."],["WORTH 👑","“For we are his workmanship, created in Christ Jesus unto good works...”","Ephesians 2:10 (KJV)","You are God's workmanship. Your life was never meant to be measured only by your mistakes."],["WORTH 👑","“Since thou wast precious in my sight, thou hast been honourable, and I have loved thee...”","Isaiah 43:4 (KJV)","You are precious in God's sight. Your worth is not waiting for human permission."],["WORTH 👑","“Ye are the light of the world. A city that is set on an hill cannot be hid.”","Matthew 5:14 (KJV)","There is light within the life God has given you. You do not have to make yourself small."],["WORTH 👑","“But ye are a chosen generation, a royal priesthood, an holy nation, a peculiar people...”","1 Peter 2:9 (KJV)","You are called, chosen, and invited to live from that identity."],["WORTH 👑","“For thou hast possessed my reins: thou hast covered me in my mother's womb.”","Psalm 139:13 (KJV)","Your life was known by God before anyone else had an opinion about you."],["WORTH 👑","“Are not five sparrows sold for two farthings, and not one of them is forgotten before God?”","Luke 12:6 (KJV)","You are not forgotten. If God remembers the sparrow, you can trust that you remain within His care."],["WORTH 👑","“Know ye not that ye are the temple of God, and that the Spirit of God dwelleth in you?”","1 Corinthians 3:16 (KJV)","Treat yourself with care. Your life is worthy of reverence, attention, and stewardship."],["WORTH 👑","“For ye are bought with a price: therefore glorify God in your body, and in your spirit, which are God's.”","1 Corinthians 6:20 (KJV)","Your value is not determined by how the world has treated you. Scripture calls you precious enough to have been bought with a price."],["COURAGE 🦁","“Have not I commanded thee? Be strong and of a good courage; be not afraid... for the LORD thy God is with thee whithersoever thou goest.”","Joshua 1:9 (KJV)","You don't have to know everything ahead of you. Take the next step remembering that God goes with you."],["COURAGE 🦁","“What time I am afraid, I will trust in thee.”","Psalm 56:3 (KJV)","Courage doesn't require the absence of fear. You can feel afraid and still choose trust."],["COURAGE 🦁","“For God hath not given us the spirit of fear; but of power, and of love, and of a sound mind.”","2 Timothy 1:7 (KJV)","Fear does not have to rule this moment. Make room for power, love, and a sound mind."],["COURAGE 🦁","“Wait on the LORD: be of good courage, and he shall strengthen thine heart...”","Psalm 27:14 (KJV)","Waiting can require courage too. Let God strengthen your heart while you wait."],["COURAGE 🦁","“Be strong and of a good courage, fear not, nor be afraid of them: for the LORD thy God... will not fail thee, nor forsake thee.”","Deuteronomy 31:6 (KJV)","You are not stepping into the unknown abandoned. God has promised His presence."],["COURAGE 🦁","“The LORD is on my side; I will not fear: what can man do unto me?”","Psalm 118:6 (KJV)","Other people's opinions do not have to become the walls around your life."],["COURAGE 🦁","“In God I have put my trust: I will not be afraid what man can do unto me.”","Psalm 56:11 (KJV)","You can move forward without giving another person's power more weight than God's presence."],["COURAGE 🦁","“He shall not be afraid of evil tidings: his heart is fixed, trusting in the LORD.”","Psalm 112:7 (KJV)","You cannot control every message tomorrow may bring. You can choose where your heart will rest today."],["COURAGE 🦁","“...If God be for us, who can be against us?”","Romans 8:31 (KJV)","You don't have to approach every challenge as though you're standing there alone."],["COURAGE 🦁","“The LORD is my light and my salvation; whom shall I fear? the LORD is the strength of my life...”","Psalm 27:1 (KJV)","When fear makes the road look dark, remember where your light and strength come from."],["COMFORT 🤍","“As one whom his mother comforteth, so will I comfort you...”","Isaiah 66:13 (KJV)","You are allowed to receive comfort. You do not have to be strong every moment."],["COMFORT 🤍","“Blessed are they that mourn: for they shall be comforted.”","Matthew 5:4 (KJV)","Your grief is seen. There is comfort for the heart that mourns."],["COMFORT 🤍","“I will not leave you comfortless: I will come to you.”","John 14:18 (KJV)","You have not been left alone in what you are carrying."],["COMFORT 🤍","“...the God of all comfort; Who comforteth us in all our tribulation...”","2 Corinthians 1:3–4 (KJV)","There is no requirement to hide your pain before coming to the God of all comfort."],["COMFORT 🤍","“Cast thy burden upon the LORD, and he shall sustain thee...”","Psalm 55:22 (KJV)","You were not created to carry every burden by yourself. Let yourself be supported."],["COMFORT 🤍","“Casting all your care upon him; for he careth for you.”","1 Peter 5:7 (KJV)","Your cares matter because you matter to God. You can place what is heavy into His care."],["COMFORT 🤍","“In the multitude of my thoughts within me thy comforts delight my soul.”","Psalm 94:19 (KJV)","When your thoughts become crowded, let God's comfort make room for quiet again."],["COMFORT 🤍","“This is my comfort in my affliction: for thy word hath quickened me.”","Psalm 119:50 (KJV)","When your heart needs somewhere to rest, return to the Word that gives life."],["COMFORT 🤍","“Yea, though I walk through the valley of the shadow of death, I will fear no evil: for thou art with me...”","Psalm 23:4 (KJV)","The valley is somewhere you walk through—not somewhere you have to walk alone."],["COMFORT 🤍","“For the LORD will not cast off for ever: But though he cause grief, yet will he have compassion according to the multitude of his mercies.”","Lamentations 3:31–32 (KJV)","Grief is not the whole story. Compassion and mercy still have a place in your journey."],["FAITH 🙏🏾","“Now faith is the substance of things hoped for, the evidence of things not seen.”","Hebrews 11:1 (KJV)","You don't have to see the whole answer before allowing faith to take root."],["FAITH 🙏🏾","“For we walk by faith, not by sight.”","2 Corinthians 5:7 (KJV)","What you can see today is not all that is possible. Keep walking."],["FAITH 🙏🏾","“Jesus said unto him, If thou canst believe, all things are possible to him that believeth.”","Mark 9:23 (KJV)","Do not let what looks impossible become the boundary around your faith."],["FAITH 🙏🏾","“For with God nothing shall be impossible.”","Luke 1:37 (KJV)","What exceeds your ability does not exceed God's."],["FAITH 🙏🏾","“...If ye have faith as a grain of mustard seed... nothing shall be impossible unto you.”","Matthew 17:20 (KJV)","Do not despise small faith. A tiny beginning can still carry possibility."],["FAITH 🙏🏾","“And all things, whatsoever ye shall ask in prayer, believing, ye shall receive.”","Matthew 21:22 (KJV)","Bring what matters to you into prayer, and make room for faith while you wait."],["FAITH 🙏🏾","“Trust in the LORD with all thine heart; and lean not unto thine own understanding.”","Proverbs 3:5 (KJV)","You do not have to understand every part of the journey before you can trust God with it."],["FAITH 🙏🏾","“Commit thy way unto the LORD; trust also in him; and he shall bring it to pass.”","Psalm 37:5 (KJV)","Place the road ahead into God's hands. You don't have to control every step before taking the next one."],["FAITH 🙏🏾","“For verily I say unto you, That whosoever shall say unto this mountain, Be thou removed... and shall not doubt in his heart...”","Mark 11:23 (KJV)","The mountain may be real, but faith reminds you that the mountain is not greater than God."],["FAITH 🙏🏾","“...Blessed are they that have not seen, and yet have believed.”","John 20:29 (KJV)","Not seeing yet does not mean there is nothing to believe for."]];let current=null,savedPromises=[],remaining=P.map((_,i)=>i);
